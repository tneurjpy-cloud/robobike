<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ROBOBIKE Analyzer (Dynamic CSV Mode)</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            margin: 10px;
            overflow-y: hidden;
            /* 縦スクロールは隠して横スクロールに集中 */
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            width: 100%;
        }

        /* ファイル入力用の装飾 */
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn-file {
            background-color: #007bff;
            color: white;
            border: 1px solid #0069d9;
            cursor: pointer;
            padding: 6px 12px;
            font-weight: bold;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .btn-file:hover {
            background-color: #0069d9;
        }

        #csvFile {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        /* 追加：ファイル名表示エリアのスタイル */
        #fileNameDisplay {
            font-size: 14px;
            color: #bbb;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        select {
            padding: 4px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        #valueTable {
            border-collapse: collapse;
            font-family: "Consolas", monospace;
            background: #000;
            flex-grow: 1;
            table-layout: fixed;
            width: 100%;
            max-width: calc(100% - 450px);
            /* ファイル名表示分の幅を考慮 */
        }

        #valueTable td {
            border: 1px solid #333;
            padding: 2px 4px;
            height: 32px;
            overflow: hidden;
            white-space: nowrap;
        }

        .cell-content {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        input[type="checkbox"] {
            margin: 0;
            cursor: pointer;
            width: 14px;
            height: 14px;
        }

        .label-text {
            font-size: 13px;
            font-weight: bold;
        }

        .num-cell {
            text-align: right;
            font-weight: bold;
            font-size: 15px;
            min-width: 60px;
        }

        /* 【重要】横スクロールバーを表示させるためのコンテナ */
        #monitor-container {
            width: calc(100vw - 20px);
            overflow-x: scroll;
            overflow-y: hidden;
            border: 1px solid #666;
            background-color: #000;
        }

        canvas {
            background-color: #000;
            display: block;
        }
    </style>
</head>

<body>
    <div class="controls">
        <div class="file-input-wrapper">
            <button class="btn-file">Load CSV File</button>
            <input type="file" id="csvFile" accept=".csv" onchange="handleFileSelect(event)">
        </div>
        <!-- 追加：ファイル名表示用の要素 -->
        <div id="fileNameDisplay">No file selected</div>
        <select id="scaleSelect" style="padding: 4px; border-radius: 4px;" onchange="renderData()">
            <option value="1.0" selected>x1</option>
            <option value="2.0">x2</option>
            <option value="5.0">x5</option>
            <option value="10.0">x10</option>
        </select>
        <table id="valueTable">
            <tr id="tableRow"></tr>
        </table>
    </div>

    <!-- 横スクロールを司るラッパー -->
    <div id="monitor-container">
        <canvas id="canvas"></canvas>
    </div>

    <script>
        // 色パターン（多めに定義。足りない場合はループして使い回します）
        const colorPalette = [
            "#ff4444", "#ff8c00", "#ff44ff", "#ffb6c1", "#ffff44",
            "#4444ff", "#00ffff", "#9400d3", "#44ff44", "#00aa00",
            "#adff2f", "#008b8b", "#ff1493", "#1e90ff", "#00ff7f"
        ];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const tableRow = document.getElementById('tableRow');
        const container = document.getElementById('monitor-container');
        const fileNameDisplay = document.getElementById('fileNameDisplay');

        let csvKeys = [];      // ファイルから読み込んだヘッダー項目を格納
        let colors = [];       // 各項目に対応する色
        let parsedLines = [];  // パースされた全CSV行データを入れる配列
        const PIXEL_PER_DATA = 1;
        let svPosEma = 0;

        // 縦幅のコンテナリサイズ設定
        function resizeContainer() {
            container.style.height = (window.innerHeight - 80) + 'px';
        }

        // テーブルヘッダーとチェックボックスの動的生成関数
        function rebuildUI() {
            tableRow.innerHTML = ""; // 既存のUIをクリア
            colors = [null, null];   // HEADERとTIME_MSの分を空ける

            csvKeys.forEach((key, i) => {
                if (i < 2) return;

                // 色の割り当て
                const color = colorPalette[(i - 2) % colorPalette.length];
                colors.push(color);

                // 初期状態でチェックを外す条件（元コードのロジックを踏襲）
                const isChecked = (key === "GY_PITCH" || key.startsWith("ACC_") || key === "SV_POS") ? "" : "checked";

                const td = document.createElement('td');
                td.innerHTML = `
                    <div class="cell-content">
                        <input type="checkbox" id="chk-${i}" ${isChecked} onchange="renderData()">
                        <span class="label-text" style="color:${color}">${key}</span>
                    </div>`;
                const numTd = document.createElement('td');
                numTd.className = 'num-cell';
                numTd.id = 'val-' + i;
                numTd.style.color = color;

                tableRow.appendChild(td);
                tableRow.appendChild(numTd);
            });
        }

        // ファイルデータを処理するコア関数
        function parseAndProcessCSV(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length === 0) return;

            // 1行目からヘッダー項目を取得
            csvKeys = lines[0].split(',').map(k => k.trim());
            rebuildUI(); // UIをファイルに合わせて再構築

            parsedLines = [];
            svPosEma = 0;

            lines.forEach((line, idx) => {
                // 1行目（ヘッダー行）自体はスキップ
                if (idx === 0) return;

                const p = line.split(',');
                if (p.length > 2 && p[0] === 'a') {
                    parsedLines.push(p);
                }
            });

            if (parsedLines.length > 0) {
                // SV_POSとSV_STRのインデックスを動的に検索
                const svPosIdx = csvKeys.indexOf("SV_POS");
                const svStrIdx = csvKeys.indexOf("SV_STR");

                // 両方の項目が存在する場合のみEMAを計算
                if (svPosIdx !== -1 && svStrIdx !== -1) {
                    parsedLines.forEach(p => {
                        if (p.length > svPosIdx && p.length > svStrIdx) {
                            let val = parseFloat(p[svPosIdx]);
                            let strVal = parseFloat(p[svStrIdx]);
                            if (strVal === 0) {
                                svPosEma = (val * 0.1) + (svPosEma * 0.9);
                            }
                        }
                    });
                }

                renderData();
            }
        }

        // ファイル選択時のハンドラ
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            fileNameDisplay.innerText = file.name; // ファイル名を表示に追加
            const reader = new FileReader();
            reader.onload = function (e) {
                parseAndProcessCSV(e.target.result);
            };
            reader.readAsText(file);
        }

        // ファイルドロップ時の共通処理
        function processFile(file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                parseAndProcessCSV(e.target.result);
            };
            reader.readAsText(file);
        }

        // ★一括描画コアロジック
        function renderData() {
            if (parsedLines.length === 0) return;

            const h = window.innerHeight - 100;
            const midY = h / 2;
            const userScale = parseFloat(document.getElementById('scaleSelect').value);
            const padding = 20;
            const innerH = h - (padding * 2);

            const servoScale = userScale * (innerH / 200);
            const gyroScale = servoScale * 2;
            const accScale = (innerH / 2) / 20.0;
            const maxVal = 100 / userScale;

            const calculatedWidth = parsedLines.length * PIXEL_PER_DATA;
            canvas.width = Math.max(calculatedWidth, window.innerWidth - 40);
            canvas.height = h;

            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, h);

            let lastX = -1;
            let lastY = new Array(csvKeys.length).fill(-1);
            let lastDrawnSecond = -1;

            const svPosIdx = csvKeys.indexOf("SV_POS");

            parsedLines.forEach((p, index) => {
                const timeMs = parseInt(p[1]);
                const nextX = index * PIXEL_PER_DATA;

                // 時間グリッドの描画
                const currentSecond = Math.floor(timeMs / 1000);
                if (currentSecond !== lastDrawnSecond && index > 0) {
                    ctx.strokeStyle = "#333";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(nextX + 0.5, 0);
                    ctx.lineTo(nextX + 0.5, h);
                    ctx.stroke();

                    ctx.fillStyle = "#00ff00";
                    ctx.font = "12px Consolas";
                    ctx.textBaseline = "alphabetic";
                    ctx.textAlign = 'right';
                    ctx.fillText(currentSecond + "s", nextX - 5, h - 8);
                    ctx.textAlign = 'start';

                    lastDrawnSecond = currentSecond;
                }

                // 各チャンネルのラインを描画
                for (let i = 2; i < csvKeys.length; i++) {
                    const chk = document.getElementById('chk-' + i);
                    if (!chk || !chk.checked) {
                        lastY[i] = -1;
                        continue;
                    }

                    if (i >= p.length || p[i] === undefined || p[i] === "") {
                        lastY[i] = -1;
                        continue;
                    }

                    let val = parseFloat(p[i]);
                    let currentScale = servoScale;
                    const keyName = csvKeys[i];

                    // 項目名（プレフィックス）に基づいてスケールを自動切り替え
                    if (keyName.startsWith("GY_")) {
                        currentScale = gyroScale;
                    } else if (keyName.startsWith("ACC_")) {
                        currentScale = accScale;
                    } else if (i === svPosIdx) {
                        currentScale = servoScale;
                        val -= svPosEma; // SV_POS用のEMAオフセット
                    } else {
                        currentScale = servoScale;
                    }

                    const nextY = midY - (val * currentScale);

                    if (lastX !== -1 && lastY[i] !== -1) {
                        ctx.strokeStyle = colors[i];
                        ctx.lineWidth = 1.5;
                        ctx.lineCap = "round";
                        ctx.lineJoin = "round";
                        ctx.beginPath();
                        ctx.moveTo(lastX, lastY[i]);
                        ctx.lineTo(nextX, nextY);
                        ctx.stroke();
                    }
                    lastY[i] = nextY;
                }
                lastX = nextX;
            });

            // 横基準線とテキストラベルのオーバーレイ描画
            for (let v of [maxVal, 0, -maxVal]) {
                const yPos = midY - (v * servoScale);
                ctx.strokeStyle = (v === 0) ? "#666" : "#222";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, Math.floor(yPos) + 0.5);
                ctx.lineTo(canvas.width, Math.floor(yPos) + 0.5);
                ctx.stroke();

                // 変更点：ループを廃止し、左端（最初の一回だけ：X=5）にラベルを描画
                const labelX = 5;
                if (v === 0) {
                    ctx.fillStyle = "#aaaaaa";
                    ctx.font = "12px sans-serif";
                    ctx.fillText("0", labelX, Math.floor(yPos) - 4);
                } else {
                    ctx.fillStyle = "#ff4444";
                    ctx.fillText("S:" + Math.round(v).toString().padStart(4, ' '), labelX, Math.floor(yPos) + 6);
                    ctx.fillStyle = "#ffff44";
                    ctx.fillText("G:" + Math.round(v / 2).toString().padStart(5, ' '), labelX + 75, Math.floor(yPos) + 6);

                    // ファイルに加速度(ACC)が含まれる場合のみA:の基準値を表示
                    if (csvKeys.some(k => k.startsWith("ACC_"))) {
                        ctx.fillStyle = "#00ffff";
                        let accLabelVal = (v === maxVal) ? 20.0 : -20.0;
                        ctx.fillText("A:" + accLabelVal.toFixed(2).padStart(6, ' ') + "m/s2", labelX + 150, Math.floor(yPos) + 6);
                    }
                }
            }

            // 右端（最終行）の数値をテーブルに反映
            const lastRow = parsedLines[parsedLines.length - 1];
            for (let i = 2; i < csvKeys.length; i++) {
                const el = document.getElementById('val-' + i);
                if (!el) continue;

                if (i >= lastRow.length || lastRow[i] === undefined || lastRow[i] === "") {
                    el.innerText = "---";
                } else {
                    const val = parseFloat(lastRow[i]);
                    el.innerText = isNaN(val) ? "---" : val.toFixed(2);
                }
            }
        }

        // 初期設定
        resizeContainer();
        window.addEventListener('resize', () => {
            resizeContainer();
            renderData();
        });

        // --- ドラッグ＆ドロップ（D&D）制御ロジック ---
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            window.addEventListener(eventName, (e) => e.preventDefault(), false);
        });

        window.addEventListener('dragover', () => {
            container.style.borderColor = '#007bff';
        });

        window.addEventListener('dragleave', () => {
            container.style.borderColor = '#666';
        });

        window.addEventListener('drop', (e) => {
            container.style.borderColor = '#666';
            const files = e.dataTransfer.files;
            if (files.length === 0) return;
            const file = files[0];
            if (file.name.endsWith('.csv') || file.type === 'text/csv') {
                fileNameDisplay.innerText = file.name; // ファイル名を表示に追加
                processFile(file);
            } else {
                alert('CSVファイルのみ受け付けています。');
            }
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ROBOBIKE Analyzer (CSV Mode)</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            margin: 10px;
            overflow-y: hidden;
            /* 縦スクロールは隠して横スクロールに集中 */
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            width: 100%;
        }

        /* ファイル入力用の装飾 */
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn-file {
            background-color: #007bff;
            color: white;
            border: 1px solid #0069d9;
            cursor: pointer;
            padding: 6px 12px;
            font-weight: bold;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .btn-file:hover {
            background-color: #0069d9;
        }

        #csvFile {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        select {
            padding: 4px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        #valueTable {
            border-collapse: collapse;
            font-family: "Consolas", monospace;
            background: #000;
            flex-grow: 1;
            table-layout: fixed;
            width: 100%;
            max-width: calc(100% - 250px);
        }

        #valueTable td {
            border: 1px solid #333;
            padding: 2px 4px;
            height: 32px;
            overflow: hidden;
            white-space: nowrap;
        }

        .cell-content {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        input[type="checkbox"] {
            margin: 0;
            cursor: pointer;
            width: 14px;
            height: 14px;
        }

        .label-text {
            font-size: 13px;
            font-weight: bold;
        }

        .num-cell {
            text-align: right;
            font-weight: bold;
            font-size: 15px;
            min-width: 60px;
        }

        /* 【重要】横スクロールバーを表示させるためのコンテナ */
        #monitor-container {
            width: calc(100vw - 20px);
            overflow-x: scroll;
            overflow-y: hidden;
            border: 1px solid #666;
            background-color: #000;
        }

        canvas {
            background-color: #000;
            display: block;
        }
    </style>
</head>

<body>
    <div class="controls">
        <div class="file-input-wrapper">
            <button class="btn-file">Load CSV File</button>
            <input type="file" id="csvFile" accept=".csv" onchange="handleFileSelect(event)">
        </div>
        <select id="scaleSelect" style="padding: 4px; border-radius: 4px;" onchange="renderData()">
            <option value="1.0" selected>x1</option>
            <option value="2.0">x2</option>
            <option value="5.0">x5</option>
            <option value="10.0">x10</option>
        </select>
        <table id="valueTable">
            <tr id="tableRow"></tr>
        </table>
    </div>

    <!-- 横スクロールを司るラッパー -->
    <div id="monitor-container">
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const MON_CSV_KEYS = [
            "HEADER",   // 0: 'a'
            "TIME_MS",  // 1
            "SV_DRV",   // 2
            "SV_STR",   // 3
            "SV_STD",   // 4
            "SWP_SG",   // 5
            "SV_POS",   // 6
            "GY_ROLL",  // 7
            "GY_YAW",   // 8
            "GY_PITCH", // 9
            "ACC_X",    // 10
            "ACC_Y",    // 11
            "ACC_Z",    // 12
        ];
        const colors = [
            null, null,
            "#ff4444",  // 2: SV_DRV
            "#ff8c00",  // 3: SV_STR
            "#ff44ff",  // 4: SV_STD
            "#ffb6c1",  // 5: SWP_SG
            "#ffff44",  // 6: SV_POS
            "#4444ff",  // 7: GY_ROLL
            "#00ffff",  // 8: GY_YAW
            "#9400d3",  // 9: GY_PITCH
            "#44ff44",  // 10: ACC_X
            "#00aa00",  // 11: ACC_Y
            "#adff2f",  // 12: ACC_Z
        ];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const tableRow = document.getElementById('tableRow');
        const container = document.getElementById('monitor-container');
        const col_count = MON_CSV_KEYS.length;

        let parsedLines = []; // パースされた全CSV行データを入れる配列
        const PIXEL_PER_DATA = 1; // 1データ点あたり横に何ピクセル進むか（お好みで調整可能）
        let svPosEma = 0;

        // テーブルヘッダーとチェックボックスの動的生成
        MON_CSV_KEYS.forEach((key, i) => {
            if (i < 2) return;
            const isChecked = (key === "GY_PITCH" || key.startsWith("ACC_") || key === "SV_POS") ? "" : "checked";
            const td = document.createElement('td');
            td.innerHTML = `
                <div class="cell-content">
                    <input type="checkbox" id="chk-${i}" ${isChecked} onchange="renderData()">
                    <span class="label-text" style="color:${colors[i]}">${key}</span>
                </div>`;
            const numTd = document.createElement('td');
            numTd.className = 'num-cell';
            numTd.id = 'val-' + i;
            numTd.style.color = colors[i];
            tableRow.appendChild(td);
            tableRow.appendChild(numTd);
        });

        // 縦幅のコンテナリサイズ設定
        function resizeContainer() {
            container.style.height = (window.innerHeight - 80) + 'px';
        }

        // ファイルが選択された時の処理
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const text = e.target.result;
                // 行ごとに分割、ヘッダーをスキップしてパース
                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

                parsedLines = [];
                svPosEma = 0; // ファイル読み込みごとにEMAをリセット

                lines.forEach(line => {
                    const p = line.split(',');
                    // 'a'から始まらない行、またはヘッダー行("HEADER")は除外
                    if (p.length >= col_count && p[0] === 'a') {
                        parsedLines.push(p);
                    }
                });

                if (parsedLines.length > 0) {
                    // 事前にSV_POS用のEMAを計算（元のロジックをシミュレート）
                    let currentSvStr = 0;
                    parsedLines.forEach(p => {
                        let val = parseFloat(p[6]); // SV_POS
                        let strVal = parseFloat(p[3]); // SV_STR
                        if (strVal === 0) {
                            svPosEma = (val * 0.1) + (svPosEma * 0.9);
                        }
                    });

                    renderData();
                }
            };
            reader.readAsText(file);
        }

        // ★一括描画コアロジック（スクロール対応）
        function renderData() {
            if (parsedLines.length === 0) return;

            const h = window.innerHeight - 100;
            const midY = h / 2;
            const userScale = parseFloat(document.getElementById('scaleSelect').value);
            const padding = 20;
            const innerH = h - (padding * 2);

            const servoScale = userScale * (innerH / 200);
            const gyroScale = servoScale * 2;
            const accScale = (innerH / 2) / 20.0;
            const maxVal = 100 / userScale;

            // 【ミソ】全データを並べるためにキャンバスの横幅を動的に巨大化させる
            const calculatedWidth = parsedLines.length * PIXEL_PER_DATA;
            canvas.width = Math.max(calculatedWidth, window.innerWidth - 40);
            canvas.height = h;

            // 画面クリア
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, h);

            let lastX = -1;
            let lastY = new Array(col_count).fill(-1);
            let lastDrawnSecond = -1;

            // 1行ずつキャンバス上に一気にプロットしていく
            parsedLines.forEach((p, index) => {
                const timeMs = parseInt(p[1]);
                const nextX = index * PIXEL_PER_DATA;

                // 1. 時間グリッド（秒の切り替わり線）を描画
                const currentSecond = Math.floor(timeMs / 1000);
                if (currentSecond !== lastDrawnSecond && index > 0) {
                    ctx.strokeStyle = "#333";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(nextX + 0.5, 0);
                    ctx.lineTo(nextX + 0.5, h);
                    ctx.stroke();

                    ctx.fillStyle = "#00ff00";
                    ctx.font = "12px Consolas";
                    ctx.textAlign = 'right';
                    ctx.fillText(currentSecond + "s", nextX - 5, h - 8);
                    ctx.textAlign = 'start';

                    lastDrawnSecond = currentSecond;
                }

                // 2. 各チャンネルのラインを描画
                for (let i = 2; i < col_count; i++) {
                    const chk = document.getElementById('chk-' + i);
                    if (!chk || !chk.checked) {
                        lastY[i] = -1;
                        continue;
                    }

                    let val = parseFloat(p[i]);
                    let currentScale = servoScale;

                    switch (i) {
                        case 2: case 3: case 4: case 5:
                            currentScale = servoScale;
                            break;
                        case 6: // SV_POS (EMAオフセットを適用)
                            currentScale = servoScale;
                            val -= svPosEma;
                            break;
                        case 7: case 8: case 9:
                            currentScale = gyroScale;
                            break;
                        case 10: case 11: case 12:
                            currentScale = accScale;
                            break;
                    }

                    const nextY = midY - (val * currentScale);

                    if (lastX !== -1 && lastY[i] !== -1) {
                        ctx.strokeStyle = colors[i];
                        ctx.lineWidth = 1.5;
                        ctx.lineCap = "round";
                        ctx.lineJoin = "round";
                        ctx.beginPath();
                        ctx.moveTo(lastX, lastY[i]);
                        ctx.lineTo(nextX, nextY);
                        ctx.stroke();
                    }
                    lastY[i] = nextY;
                }
                lastX = nextX;
            });

            // 3. 横基準線（水平グリッド：最大値・ゼロ・最小値）を最前面にオーバーレイ描画
            for (let v of [maxVal, 0, -maxVal]) {
                const yPos = midY - (v * servoScale);
                ctx.strokeStyle = (v === 0) ? "#666" : "#222";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, Math.floor(yPos) + 0.5);
                ctx.lineTo(canvas.width, Math.floor(yPos) + 0.5);
                ctx.stroke();

                // テキストラベルを定期的な間隔（1000pxごと）に複製してスクロール中も見やすくする
                for (let labelX = 5; labelX < canvas.width; labelX += 1000) {
                    if (v === 0) {
                        ctx.fillStyle = "#aaaaaa";
                        ctx.font = "12px sans-serif";
                        ctx.fillText("0", labelX, Math.floor(yPos) - 4);
                    } else {
                        ctx.fillStyle = "#ff4444";
                        ctx.fillText("S:" + Math.round(v).toString().padStart(4, ' '), labelX, Math.floor(yPos) + 6);
                        ctx.fillStyle = "#ffff44";
                        ctx.fillText("G:" + Math.round(v / 2).toString().padStart(5, ' '), labelX + 75, Math.floor(yPos) + 6);
                        ctx.fillStyle = "#00ffff";
                        let accLabelVal = (v === maxVal) ? 20.0 : -20.0;
                        ctx.fillText("A:" + accLabelVal.toFixed(2).padStart(6, ' ') + "m/s2", labelX + 150, Math.floor(yPos) + 6);
                    }
                }
            }

            // 4. 右端（最終行）の数値をテーブルに反映
            const lastRow = parsedLines[parsedLines.length - 1];
            for (let i = 2; i < col_count; i++) {
                const val = parseFloat(lastRow[i]);
                const el = document.getElementById('val-' + i);
                if (el) el.innerText = isNaN(val) ? "---" : val.toFixed(2);
            }
        }

        // 初期設定
        resizeContainer();
        window.addEventListener('resize', () => {
            resizeContainer();
            renderData();
        });

        // --- ドラッグ＆ドロップ（D&D）制御ロジック ---

        // ブラウザがファイルそのものを開いてしまうデフォルト挙動を防止
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            window.addEventListener(eventName, (e) => e.preventDefault(), false);
        });

        // 画面内にファイルがドラッグされてきたときの視覚的フィードバック（お好みで）
        window.addEventListener('dragover', () => {
            container.style.borderColor = '#007bff'; // ドラッグ中は枠線を青くする
        });

        window.addEventListener('dragleave', () => {
            container.style.borderColor = '#666'; // 離れたら元に戻す
        });

        // ファイルがドロップされた瞬間の処理
        window.addEventListener('drop', (e) => {
            container.style.borderColor = '#666'; // 枠線を元に戻す

            const files = e.dataTransfer.files;
            if (files.length === 0) return;

            const file = files[0];
            // CSVファイルであるか簡易チェック
            if (file.name.endsWith('.csv') || file.type === 'text/csv') {
                processFile(file);
            } else {
                alert('CSVファイルのみ受け付けています。');
            }
        });

        // ファイル読み込み処理を共通化するための関数
        function processFile(file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const text = e.target.result;
                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

                parsedLines = [];
                svPosEma = 0;

                lines.forEach(line => {
                    const p = line.split(',');
                    if (p.length >= col_count && p[0] === 'a') {
                        parsedLines.push(p);
                    }
                });

                if (parsedLines.length > 0) {
                    let currentSvStr = 0;
                    parsedLines.forEach(p => {
                        let val = parseFloat(p[6]); // SV_POS
                        let strVal = parseFloat(p[3]); // SV_STR
                        if (strVal === 0) {
                            svPosEma = (val * 0.1) + (svPosEma * 0.9);
                        }
                    });

                    renderData();
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>BICYCLE ROBOT Control</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            flex-direction: column;
        }

        .forward-button {
            width: 28%;
            height: 75px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            background-color: #81abff;
            margin-bottom: 20px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 5vw;
            width: 100%;
        }

        button {
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            width: 28%;
            height: 75px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-lr {
            background-color: #81abff;
        }

        .btn-lr2 {
            background-color: #81abff;
            height: 50px;
        }

        .btn-start {
            background-color: #fd7878;
            width: 28%;
            height: 75px;
            margin-top: 20px;
        }

        .btn-bk {
            background-color: #81abff;
            width: 28%;
            height: 50px;
            margin-top: 10px;
        }

        button:active {
            opacity: 0.7;
        }

        /* Slider for steering */
        #slider {
            width: 90vw;
            height: 50px;
            -webkit-appearance: none;
            appearance: none;
            background: #ccc;
            border-radius: 10px;
        }

        /* スライダーのつまみ（thumb）のスタイル */
        #slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 75px;
            height: 45px;
            background: #333;
            cursor: pointer;
        }

        #slider::-moz-range-thumb {
            width: 20px;
            height: 30px;
            background: #333;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>ROBOBIKE CONTROL</h2>
    <div style="font-size: 12px; text-align: center;">
        <span style="margin-top: 0px; " margin-bottom: 0px; color: black;">PROGVER</span>
        <span id="prog_ver">---</span>
        <br>
    </div>

    <div class="button-container">
        <button class="btn-lr" ontouchstart="startCommand('bt_L')" ontouchend="cancelCommand()">←<br>LEFT</button>
        <button class="forward-button" ontouchstart="sendCommand('bt_F')">↑<br>FORWARD</button>
        <button class="btn-lr" ontouchstart="startCommand('bt_R')" ontouchend="cancelCommand()">→<br>RIGHT</button>
    </div>

    <input type="range" id="slider" min="-100" max="100" step="1" value="0">

    <button class="btn-start" ontouchstart="sendCommand('bt_S')">!<br>STOP</button>
    <br>
    <button class="btn-bk" ontouchstart="sendCommand('bt_BK')">BACK</button>
    <br>

    <!-- Drive Speed -->
    <div style="font-size: 16px; text-align: center; font-weight: bold;">
        <span style="color: rgb(255, 0, 0);">DRIVE SPEED</span>
        <span id="mot_spd">---</span>
    </div>
    <div class="button-container">
        <button class="btn-lr2" onclick="sendCommand('bt_A_Up_0')">↑</button>
        <button class="btn-lr2" onclick="sendCommand('bt_A_Dn_0')">↓</button>
    </div>

    <button onclick="window.location.href='/setup';" style="
        height: 70px; 
        font-size: 16px; 
        border-radius: 15px; 
        width: 50%; 
        margin-top: 40px;">
        SETUP
    </button>

    <script>
        const SLD_MIN = -100;
        const SLD_MAX = 100;
        const slider = document.getElementById('slider');
        let lastValue = slider.value;

        const COMMAND_NAMES = [
            'stp_all', 'only_data', 'bt_F', 'bt_S', 'bt_L', 'bt_R', 'bt_Str_S', 'bt_BK',
            'bt_A_Up_0', 'bt_A_Dn_0', 'bt_A_Up', 'bt_A_Dn', 'bt_A_L', 'bt_A_R',
            'bt_S_Up', 'bt_S_Dn', 'bt_R_Up', 'bt_R_Dn', 'bt_D_St', 'bt_D_Up',
            'bt_D_Dn', 'bt_Std_nutAuto', 'bt_Std_nutUp', 'bt_Std_nutDn',
            'bt_str_turnUp', 'bt_str_turnDn', 'bt_strcmd_Up', 'bt_strcmd_Dn',
            'IR_ON', 'IR_OFF', 'bt_yaw_coeffUp', 'bt_yaw_coeffDn', 'bt_Ld_Default'
        ];

        const CMD_ID = { unknown: 0 };
        COMMAND_NAMES.forEach((name, index) => {
            CMD_ID[name] = index + 1;
        });
        // 使用例: console.log(CMD_ID.bt_F); // 3 が出力される

        const CSV_KEYS = [
            "HEADER",       // 0: 'b'
            "PROG_VER",     // 1
            "DATA_VER",     // 2
            "STATUS",       // 3
            "STR0",         // 4
            "MOT_SPD",      // 5
            "GAIN_STR",     // 6
            "GAIN_W_ROLL",  // 7
            "GAIN_DIFF",    // 8
            "ANG_STD_NUT",  // 9
            "STR_TURN",     // 10
            "YAW_COEFF",    // 11
            "AUTO_CIRCLING",// 12
            "STR_CMD_RATE", // 13
            "STR_CMD_SPD"   // 14
        ];

        const CSV_IDX = Object.fromEntries(CSV_KEYS.map((key, index) => [key, index]));

        function updateDisplay(dataArray) {
            if (!dataArray || dataArray[CSV_IDX.HEADER] !== 'b') return;

            if (document.getElementById('prog_ver'))
                document.getElementById('prog_ver').innerText = dataArray[CSV_IDX.PROG_VER];

            if (document.getElementById('mot_spd'))
                document.getElementById('mot_spd').innerText = dataArray[CSV_IDX.MOT_SPD];

            if (dataArray[CSV_IDX.STR_CMD_RATE] !== undefined) {
                const rate = parseFloat(dataArray[CSV_IDX.STR_CMD_RATE]);
                slider.value = rate;
                lastValue = slider.value;
            }
        }

        function fetchInitialData() {
            sendCommand('only_data');
        }

        window.onload = fetchInitialData;

        setInterval(() => {
            const currentValue = slider.value;
            if (currentValue !== lastValue) {
                lastValue = currentValue;
                sendValue('bt_Str_S', currentValue);
            }
        }, 250);

        // 【追加】2秒ごとのステータス定期更新
        setInterval(() => { 
            sendCommand('only_data');
        }, 2000);

        function startCommand(button) {
            sendCommand(button);
        }

        function sendCommand(buttonName) {
            const id = CMD_ID[buttonName];
            if (id === undefined) return;

            fetch(`/command?button=${id}`)
                .then(response => response.text())
                .then(csvText => {
                    const data = csvText.split(',').map(s => s.trim());
                    updateDisplay(data);
                })
                .catch(error => console.error('Error:', error));
        }

        // スライダー値の送信（IDに変換）
        function sendValue(cmdName, value) {
            const id = CMD_ID[cmdName];
            if (id === undefined) return;

            fetch(`/command?button=${id}&value=${value}`)
                .then(response => response.text())
                .then(csvText => {
                    const dataArray = csvText.split(',').map(s => s.trim());
                    updateDisplay(dataArray);
                })
                .catch(error => console.error('Error:', error));
        }

        document.getElementById("slider").min = SLD_MIN;
        document.getElementById("slider").max = SLD_MAX;
    </script>
</body>

</html>

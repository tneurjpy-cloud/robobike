<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ROBOBIKE Monitor</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            margin: 10px;
            overflow: hidden;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            width: 100%;
        }

        button {
            background-color: #444;
            color: white;
            border: 1px solid #888;
            cursor: pointer;
            padding: 6px 12px;
            font-weight: bold;
            border-radius: 4px;
            flex-shrink: 0;
            /* ボタンが潰れないように固定 */
        }

        #downloadBtn {
            background-color: #28a745;
        }

        #downloadBtn:disabled {
            background-color: #444;
            color: #888;
        }

        /* 測定モードON時のスタイル */
        #sweepBtn.active {
            background-color: #dc3545;
            border-color: #ff6b6b;
        }

        select {
            padding: 4px;
            border-radius: 4px;
            flex-shrink: 0;
            /* セレクトボックスが潰れないように固定 */
        }

        /* ★ 左側にボタンが増えたため、確保するスペースを 250px から 420px に拡張 */
        #valueTable {
            border-collapse: collapse;
            font-family: "Consolas", monospace;
            background: #000;
            flex-grow: 1;
            /* 残りの横幅をいっぱいに使う */
            table-layout: fixed;
            /* セル幅を均等に固定してはみ出しを防群 */
            width: 100%;
            max-width: calc(100% - 420px);
        }

        #valueTable td {
            border: 1px solid #333;
            padding: 2px 4px;
            /* セル内の余白を少し詰めて凝縮 */
            height: 32px;
            overflow: hidden;
            /* 万が一文字が溢れてもレイアウトを崩さない */
            white-space: nowrap;
            /* 文字の自動改行を禁止 */
        }

        .cell-content {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        input[type="checkbox"] {
            margin: 0;
            cursor: pointer;
            width: 14px;
            height: 14px;
        }

        .label-text {
            font-size: 13px;
            /* 項目名（文字）を少し小さく */
            font-weight: bold;
        }

        .num-cell {
            text-align: right;
            font-weight: bold;
            font-size: 15px;
            /* 数値の文字サイズを調整 */
        }

        canvas {
            background-color: #000;
            display: block;
            border: 1px solid #666;
        }
    </style>
</head>

<body>
    <div class="controls">
        <button onclick="togglePause()" id="pauseBtn">PAUSE</button>
        <button onclick="downloadCSV()" id="downloadBtn" disabled>Save CSV</button>
        <button onclick="toggleSweep()" id="sweepBtn">SWEEP START</button>
        <select id="scaleSelect" style="padding: 4px; border-radius: 4px;">
            <option value="1.0" selected>x1</option>
            <option value="2.0">x2</option>
            <option value="5.0">x5</option>
            <option value="10.0">x10</option>
        </select>
        <table id="valueTable">
            <tr id="tableRow"></tr>
        </table>
    </div>
    <canvas id="canvas"></canvas>

    <script>

        const MON_CSV_KEYS = [
            "HEADER", "TIME_MS", "SV_DRV", "SV_STR", "SV_STD",
            "GY_ROLL", "GY_YAW", "GY_PITCH", "ACC_X", "ACC_Y", "ACC_Z", "SV_POS"
        ];
        const colors = [
            null, null, "#ff4444", "#44ff44", "#4444ff",
            "#ffff44", "#ff44ff", "#ffffff", "#00ffff", "#ffa500", "#aaaaaa", "#ff8c00"
        ];
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const tableRow = document.getElementById('tableRow');
        let isPaused = false;
        let isSweepMode = false; // ★ 測定モードの状態管理
        let dataLog = [];
        let lastX = -1;
        let lastY = new Array(12).fill(-1);
        let currentDrawX = 0; // 追加: 実際の描画X座標
        let lastDrawnSecond = -1;  // 追加: 秒またぎ判定用
        const DOT_MS = 5;
        const xhr = new XMLHttpRequest();

        function resizeCanvas() {
            canvas.width = window.innerWidth - 20;
            canvas.height = window.innerHeight - 120;
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pauseBtn').innerText = isPaused ? "RESUME" : "PAUSE";
            document.getElementById('downloadBtn').disabled = !isPaused;

            if (!isPaused) {
                clearEspBuffer();
            }
        }
        // ★ 測定モード切り替え関数（ESP32へ状態を送信）
        function toggleSweep() {
            isSweepMode = !isSweepMode;
            const btn = document.getElementById('sweepBtn');

            if (isSweepMode) {
                btn.innerText = "SWEEP STOP";
                btn.classList.add('active');
            } else {
                btn.innerText = "SWEEP START";
                btn.classList.remove('active');
            }

            // ESP32のWebサーバーへ要求を送信 (GET /set_sweep?run=1 または 0)
            const xhr = new XMLHttpRequest();
            xhr.open('GET', `/command?button=${isSweepMode ? 1 : 0}`, true);
            xhr.send();
        }

        function update() {
            if (isPaused) return;

            xhr.open('GET', '/get_acc', false);
            xhr.send();
            if (xhr.status !== 200) return;

            const text = xhr.responseText.trim();
            if (text.length === 0) return;

            const lines = text.split('\n').filter(l => l.length > 0);

            const h = canvas.height;
            const midY = h / 2;
            const userScale = parseFloat(document.getElementById('scaleSelect').value);
            const padding = 20;
            const innerH = h - (padding * 2);

            const servoScale = userScale * (innerH / 200);
            const gyroScale = servoScale * 2;
            const accScale = (innerH / 2) / 20.0;
            const maxVal = 100 / userScale;

            const drawStartIndex = lines.length > 40 ? lines.length - 40 : 0;

            lines.forEach((line, index) => {
                const p = line.split(',');
                if (p.length < 12) return;

                dataLog.push(line);
                if (dataLog.length > 12000) dataLog.shift();

                if (index < drawStartIndex) return;

                const timeMs = parseInt(p[1]);

                const nextX = currentDrawX;
                currentDrawX = (currentDrawX + 1) % canvas.width;

                if (nextX === 0) {
                    lastX = -1;
                }

                if (nextX !== lastX) {
                    ctx.fillStyle = "#000";
                    ctx.fillRect(nextX + 1, 0, 6, h);
                }

                for (let i = 2; i < 12; i++) {
                    if (p[i] === undefined) { lastY[i] = -1; continue; }

                    const chk = document.getElementById('chk-' + i);
                    if (!chk || !chk.checked) {
                        lastY[i] = -1; continue;
                    }

                    const val = parseFloat(p[i]);

                    let currentScale;
                    if (i === 11 || i < 5) {
                        currentScale = servoScale;
                    } else if (i >= 8) {
                        currentScale = accScale;
                    } else {
                        currentScale = gyroScale;
                    }

                    const nextY = midY - (val * currentScale);

                    if (lastX !== -1 && lastY[i] !== -1) {
                        ctx.strokeStyle = colors[i];
                        ctx.lineWidth = 1.5;

                        ctx.lineCap = "round";
                        ctx.lineJoin = "round";

                        ctx.beginPath();
                        ctx.moveTo(lastX, lastY[i]);
                        ctx.lineTo(nextX, nextY);
                        ctx.stroke();
                    }
                    lastY[i] = nextY;
                }

                const currentSecond = Math.floor(timeMs / 1000);
                if (currentSecond !== lastDrawnSecond) {
                    ctx.strokeStyle = "#333";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(nextX + 0.5, 0);
                    ctx.lineTo(nextX + 0.5, h);
                    ctx.stroke();

                    ctx.fillStyle = "#00ff00";
                    ctx.font = "12px Consolas";
                    ctx.textAlign = 'right';
                    ctx.fillText(currentSecond + "s", nextX - 5, h - 8);
                    ctx.textAlign = 'start';

                    lastDrawnSecond = currentSecond; // 描画した秒を更新
                }

                lastX = nextX;
            });

            for (let v of [maxVal, 0, -maxVal]) {
                const yPos = midY - (v * servoScale);

                ctx.strokeStyle = (v === 0) ? "#666" : "#222";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, Math.floor(yPos) + 0.5);
                ctx.lineTo(canvas.width, Math.floor(yPos) + 0.5);
                ctx.stroke();

                if (v === 0) {
                    ctx.fillStyle = "#aaaaaa";
                    ctx.fillText("0", 5, Math.floor(yPos) - 4);
                } else {
                    ctx.fillStyle = "rgba(0,0,0,0.8)";
                    ctx.fillRect(5, Math.floor(yPos) - 12, 280, 24);

                    ctx.fillStyle = "#ff4444";
                    ctx.fillText("S:" + Math.round(v).toString().padStart(4, ' '), 10, Math.floor(yPos) + 6);

                    ctx.fillStyle = "#ffff44";
                    ctx.fillText("G:" + Math.round(v / 2).toString().padStart(5, ' '), 85, Math.floor(yPos) + 6);

                    ctx.fillStyle = "#00ffff";
                    let accLabelVal = (v === maxVal) ? 20.0 : -20.0;
                    ctx.fillText("A:" + accLabelVal.toFixed(2).padStart(6, ' ') + "m/s2", 160, Math.floor(yPos) + 6);
                }
            }

            const last = lines[lines.length - 1].split(',');
            for (let i = 2; i < 12; i++) {
                const val = parseFloat(last[i]);
                const el = document.getElementById('val-' + i);
                if (el) el.innerText = isNaN(val) ? "---" : val.toFixed(2);
            }
        }

        function downloadCSV() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const nn = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            const filename = `${yyyy}${mm}${dd}${hh}${nn}${ss}.csv`;

            const header = MON_CSV_KEYS.join(',') + '\n';
            const blob = new Blob([header + dataLog.join('\n')], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
        }

        MON_CSV_KEYS.forEach((key, i) => {
            if (i < 2) return;
            const isChecked = 
                (key === "GY_PITCH" || key.startsWith("ACC_") || key === "SV_POS") ? "" : "checked";
            const td = document.createElement('td');
            td.innerHTML = `
                <div class="cell-content">
                    <input type="checkbox" id="chk-${i}" ${isChecked}>
                    <span class="label-text" style="color:${colors[i]}">${key}</span>
                </div>`;
            const numTd = document.createElement('td');
            numTd.className = 'num-cell';
            numTd.id = 'val-' + i;
            numTd.style.color = colors[i];
            tableRow.appendChild(td);
            tableRow.appendChild(numTd);
        });

        function clearEspBuffer() {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', '/clear_buffer', true); // 描画を止めないよう非同期(true)で送信
            xhr.send();

            // ついでにブラウザ側のCanvasと描画起点をリセットして画面を綺麗にする
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            lastX = -1;
            lastY.fill(-1);
            currentDrawX = 0;       // 描画位置を左端に戻す
            lastDrawnSecond = -1;   // 目盛りの秒数カウントをリセット
        }

        // 実行部 /////////////////////////////////////////////////////////////////////////////
        resizeCanvas();
        setInterval(update, 50);

        window.addEventListener('resize', resizeCanvas);

        window.addEventListener('load', clearEspBuffer);

        window.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' || e.key === 'Esc') {
                e.preventDefault();
                togglePause();
            }
        });

    </script>
</body>

</html>

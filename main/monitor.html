<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ROBOBIKE Monitor</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            margin: 10px;
            overflow: hidden;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            width: 100%;
        }

        button {
            background-color: #444;
            color: white;
            border: 1px solid #888;
            cursor: pointer;
            padding: 6px 12px;
            font-weight: bold;
            border-radius: 4px;
            flex-shrink: 0; /* ボタンが潰れないように固定 */
        }

        #downloadBtn {
            background-color: #28a745;
        }

        #downloadBtn:disabled {
            background-color: #444;
            color: #888;
        }

        select {
            padding: 4px;
            border-radius: 4px;
            flex-shrink: 0; /* セレクトボックスが潰れないように固定 */
        }

        /* ★ テーブル全体が画面右端からはみ出さないように自動縮小する設定 */
        #valueTable {
            border-collapse: collapse;
            font-family: "Consolas", monospace;
            background: #000;
            flex-grow: 1;          /* 残りの横幅をいっぱいに使う */
            table-layout: fixed;   /* セル幅を均等に固定してはみ出しを防ぐ */
            width: 100%;
            max-width: calc(100% - 250px); /* 左側のボタン類のスペースを確保 */
        }

        #valueTable td {
            border: 1px solid #333;
            padding: 2px 4px;      /* セル内の余白を少し詰めて凝縮 */
            height: 32px;
            overflow: hidden;      /* 万が一文字が溢れてもレイアウトを崩さない */
            white-space: nowrap;   /* 文字の自動改行を禁止 */
        }

        .cell-content {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        input[type="checkbox"] {
            margin: 0;
            cursor: pointer;
            width: 14px;
            height: 14px;
        }

        .label-text {
            font-size: 13px;       /* 項目名（文字）を少し小さく */
            font-weight: bold;
        }

        .num-cell {
            text-align: right;
            font-weight: bold;
            font-size: 15px;       /* 数値の文字サイズを調整 */
        }

        canvas {
            background-color: #000;
            display: block;
            border: 1px solid #666;
        }
    </style>
</head>

<body>
    <div class="controls">
        <button onclick="togglePause()" id="pauseBtn">PAUSE</button>
        <button onclick="downloadCSV()" id="downloadBtn" disabled>Save CSV</button>
        <select id="scaleSelect" style="padding: 4px; border-radius: 4px;">
            <option value="0.25">x0.5</option>
            <option value="0.5" selected>x1.0</option>
            <option value="1.0">x2.0</option>
        </select>
        <table id="valueTable">
            <tr id="tableRow"></tr>
        </table>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const MON_CSV_KEYS = [
            "HEADER", "TIME_MS", "SV_DRV", "SV_STR", "SV_STD",
            "GY_ROLL", "GY_YAW", "GY_PITCH", "ACC_X", "ACC_Y", "ACC_Z"
        ];
        // 加速度計(8,9,10)用のカラー（シアン、オレンジ、グレー）
        const colors = [
            null, null, "#ff4444", "#44ff44", "#4444ff",
            "#ffff44", "#ff44ff", "#ffffff", "#00ffff", "#ffa500", "#aaaaaa"
        ];
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const tableRow = document.getElementById('tableRow');
        let isPaused = false;
        let dataLog = [];
        let lastX = -1;
        let lastY = new Array(11).fill(-1);
        const DOT_MS = 5;

        function resizeCanvas() {
            canvas.width = window.innerWidth - 20;
            canvas.height = window.innerHeight - 120;
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pauseBtn').innerText = isPaused ? "RESUME" : "PAUSE";
            document.getElementById('downloadBtn').disabled = !isPaused;
        }

        function update() {
            if (isPaused) return;

            const xhr = new XMLHttpRequest();
            xhr.open('GET', '/get_acc', false);
            try {
                xhr.send();
                if (xhr.status !== 200) return;
                const lines = xhr.responseText.trim().split('\n').filter(l => l.length > 0);

                const h = canvas.height;
                const midY = h / 2;
                const userScale = parseFloat(document.getElementById('scaleSelect').value);
                const padding = 20;
                const innerH = h - (padding * 2);

                // 各系統のベーススケール計算
                const servoScale = userScale * (innerH / 200); // 100で端に到達
                const gyroScale = servoScale * 2;              // 50で端に到達

                // 【独立設定】±20 m/s2 の範囲が画面の有効範囲（innerH / 2）にピッタリ収まる固定倍率
                const accScale = (innerH / 2) / 20.0;

                const maxVal = 100 / userScale;

                lines.forEach(line => {
                    const p = line.split(',');
                    if (p.length < 8) return;
                    dataLog.push(line);
                    if (dataLog.length > 12000) dataLog.shift();

                    const timeMs = parseInt(p[1]);
                    const nextX = Math.floor(timeMs / DOT_MS) % canvas.width;

                    ctx.fillStyle = "#000";
                    ctx.fillRect(nextX, 0, 6, h);

                    for (let i = 2; i < 11; i++) {
                        if (p[i] === undefined) { lastY[i] = -1; continue; }
                        if (!document.getElementById('chk-' + i).checked) {
                            lastY[i] = -1; continue;
                        }
                        const val = parseFloat(p[i]);

                        let currentScale;
                        if (i >= 8) {
                            currentScale = accScale;     // 加速度用 (±20m/s2固定)
                        } else if (i >= 5) {
                            currentScale = gyroScale;    // ジャイロ用
                        } else {
                            currentScale = servoScale;   // サーボ用
                        }

                        const nextY = midY - (val * currentScale);

                        if (lastX !== -1 && lastY[i] !== -1 && nextX > lastX) {
                            ctx.strokeStyle = colors[i];
                            ctx.lineWidth = 1.5;
                            ctx.beginPath();
                            ctx.moveTo(lastX, lastY[i]);
                            ctx.lineTo(nextX, nextY);
                            ctx.stroke();
                        }
                        lastY[i] = nextY;
                    }

                    if (Math.floor(timeMs / 1000) !== Math.floor((timeMs - 5) / 1000)) {
                        ctx.strokeStyle = "#333";
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(nextX + 0.5, 0);
                        ctx.lineTo(nextX + 0.5, h);
                        ctx.stroke();
                        ctx.fillStyle = "#00ff00";
                        ctx.font = "12px Consolas";
                        ctx.textAlign = 'right';
                        ctx.fillText((Math.floor(timeMs / 1000)) + "s", nextX - 5, h - 8);
                        ctx.textAlign = 'start';
                    }
                    lastX = nextX;
                });

                // 背景グリッドと目盛りの描画
                [maxVal, 0, -maxVal].forEach((v, index) => {
                    const yPos = midY - (v * servoScale);

                    ctx.strokeStyle = (v === 0) ? "#666" : "#222";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, Math.floor(yPos) + 0.5);
                    ctx.lineTo(canvas.width, Math.floor(yPos) + 0.5);
                    ctx.stroke();

                    ctx.fillStyle = "rgba(0,0,0,0.8)";
                    ctx.fillRect(5, Math.floor(yPos) - 12, 280, 24);

                    ctx.fillStyle = "#ff4444";
                    ctx.fillText("S:" + Math.round(v).toString().padStart(4, ' '), 10, Math.floor(yPos) + 6);

                    ctx.fillStyle = "#ffff44";
                    ctx.fillText("G:" + Math.round(v / 2).toString().padStart(5, ' '), 85, Math.floor(yPos) + 6);

                    // 【変更】グリッド線上（上端、中央、下端）に対応する m/s2 を直接表示
                    ctx.fillStyle = "#00ffff";
                    let accLabelVal = 0.0;
                    if (index === 0) accLabelVal = 20.0;
                    if (index === 2) accLabelVal = -20.0;
                    
                    ctx.fillText("A:" + accLabelVal.toFixed(2).padStart(6, ' ') + "m/s2", 160, Math.floor(yPos) + 6);
                });

                const last = lines[lines.length - 1].split(',');
                for (let i = 2; i < 11; i++) {
                    const val = parseFloat(last[i]);
                    const el = document.getElementById('val-' + i);
                    if (el) el.innerText = isNaN(val) ? "---" : val.toFixed(2);
                }
            } catch (e) { }
        }

        function downloadCSV() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const nn = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            const filename = `${yyyy}${mm}${dd}${hh}${nn}${ss}.csv`;

            const header = MON_CSV_KEYS.join(',') + '\n';
            const blob = new Blob([header + dataLog.join('\n')], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
        }

        MON_CSV_KEYS.forEach((key, i) => {
            if (i < 2) return;
            const isChecked = (key === "GY_PITCH" || key.startsWith("ACC_")) ? "" : "checked";
            const td = document.createElement('td');
            td.innerHTML = `
                <div class="cell-content">
                    <input type="checkbox" id="chk-${i}" ${isChecked}>
                    <span class="label-text" style="color:${colors[i]}">${key}</span>
                </div>`;
            const numTd = document.createElement('td');
            numTd.className = 'num-cell';
            numTd.id = 'val-' + i;
            numTd.style.color = colors[i];
            tableRow.appendChild(td);
            tableRow.appendChild(numTd);
        });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' || e.key === 'Esc') {
                e.preventDefault();
                togglePause();
            }
        });

        setInterval(update, 50);
    </script>
</body>

</html>
